services:
  bible-api:
    image: ghcr.io/gollenia/bibleapi:latest
    ports:
      - "8080:8080"
    volumes:
      # Set BIBLE_DB_PATH to a directory containing one or more SQLite Bible databases.
      - ${BIBLE_DB_PATH:?Set_BIBLE_DB_PATH_to_your_database_directory}:/app/db:ro
    restart: unless-stopped
